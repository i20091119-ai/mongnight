// ── MAIN ─────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("form");
  const [f, setF] = useState(JSON.parse(JSON.stringify(INIT)));

  useEffect(() => {
    const el = document.createElement("style");
    el.id = "mk-print-css";
    el.textContent = `
      @media print {
        body > * { display: none !important; }
        #mk-pa { display: block !important; position: fixed; inset: 0; width: 100%; }
        @page { size: A4 portrait; margin: 12mm 16mm; }
      }
      #mk-pa { display: none; }
    `;
    document.head.appendChild(el);
    return () => document.getElementById("mk-print-css")?.remove();
  }, []);

  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setObj = (i, v) => setF(p => { const a = [...p.objectives]; a[i] = v; return { ...p, objectives: a }; });
  const setSes = (i, k, v) => setF(p => ({ ...p, sessions: p.sessions.map((s, j) => j === i ? { ...s, [k]: v } : s) }));
  const addSes = () => setF(p => ({ ...p, sessions: [...p.sessions, { step: "전개", content: "", methods: [], time: "20" }] }));
  const toggleMethod = (i, m) => setF(p => ({
    ...p,
    sessions: p.sessions.map((s, j) => {
      if (j !== i) return s;
      const ms = s.methods.includes(m) ? s.methods.filter(x => x !== m) : [...s.methods, m];
      return { ...s, methods: ms };
    }),
  }));
  const delSes = (i) => setF(p => ({ ...p, sessions: p.sessions.filter((_, j) => j !== i) }));

  const setPrev = (i, v) => setF(p => { const a=[...p.prevTitles]; a[i]=v; return {...p, prevTitles:a}; });
  const addPrev = () => setF(p => ({ ...p, prevTitles: [...p.prevTitles, ""] }));
  const delPrev = (i) => setF(p => ({ ...p, prevTitles: p.prevTitles.filter((_,j)=>j!==i) }));
  const setNext = (i, v) => setF(p => { const a=[...p.nextTitles]; a[i]=v; return {...p, nextTitles:a}; });
  const addNext = () => setF(p => ({ ...p, nextTitles: [...p.nextTitles, ""] }));
  const delNext = (i) => setF(p => ({ ...p, nextTitles: p.nextTitles.filter((_,j)=>j!==i) }));

  const setApp = (i, v) => setF(p => { const a=[...p.preApps]; a[i]=v; return {...p, preApps:a}; });
  const addApp = () => setF(p => ({ ...p, preApps: [...p.preApps, ""] }));
  const delApp = (i) => setF(p => ({ ...p, preApps: p.preApps.filter((_,j)=>j!==i) }));

  const [tagInput, setTagInput] = useState("");
  const addTag = (v) => { const t=v.trim().replace(/^#+/,""); if(t && !f.tags.includes(t)) set("tags",[...f.tags,t]); };
  const delTag = (t) => set("tags", f.tags.filter(x=>x!==t));

  const totalMin = f.sessions.reduce((s, x) => s + (parseInt(x.time) || 0), 0);
  const validObjs = f.objectives.filter(o => o.trim());

  const navBtn = (label, id) => (
    <button onClick={() => setTab(id)} style={{
      padding: "7px 16px", borderRadius: 6, border: "1px solid rgba(255,255,255,0.3)",
      background: tab === id ? "rgba(255,255,255,0.2)" : "transparent",
      color: "#fff", cursor: "pointer", fontSize: 13, fontFamily: "inherit",
    }}>{label}</button>
  );

  // ── 인쇄 영역 ───────────────────────────────────────────────
  const PrintArea = () => (
    <div style={{ width: "210mm", maxWidth: "100%", background: "#fff", color: "#111", padding: "16mm 18mm", boxSizing: "border-box", ...base, fontSize: 11, lineHeight: 1.6 }}>
      {/* 헤더 */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "2.5px solid #111", paddingBottom: 10, marginBottom: 14 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src={LOGO_SRC} alt="뭉클 로고" style={{ width: 46, height: 46, objectFit: "contain" }}/>
          <div>
            <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: "-0.5px", lineHeight: 1.2 }}>뭉클한 밤</div>
            <div style={{ fontSize: 9.5, color: "#666" }}>교원 디지털 야학</div>
          </div>
        </div>
        <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: "4px" }}>강 의 계 획 서</div>
      </div>

      {/* 태그 */}
      {f.tags.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 10 }}>
          {f.tags.map(t => (
            <span key={t} style={{ padding: "1px 8px", borderRadius: 20, border: "0.5px solid #888", fontSize: 9.5, color: "#555" }}>#{t}</span>
          ))}
        </div>
      )}

      {/* 기본 정보 */}
      <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 14 }}>
        <tbody>
          <tr>
            <td style={{ ...th, width: "13%" }}>강의 시간</td>
            <td style={td} colSpan={3}>{parseInt(f.duration)/60}시간 ({f.duration}분)</td>
          </tr>
          {f.bio && (
            <tr>
              <td style={th}>강사 소개</td>
              <td style={td} colSpan={3}>{f.bio}</td>
            </tr>
          )}
          <tr>
            <td style={th}>수강 대상</td>
            <td style={td}>{f.target || "─"}</td>
            <td style={th}>수강 수준</td>
            <td style={td}>
              <span style={{ padding: "1px 7px", borderRadius: 20, border: "1px solid #111", fontSize: 10, fontWeight: 700 }}>{f.level}</span>
            </td>
          </tr>
          <tr>
            <td style={th}>출발점 수준</td>
            <td style={td} colSpan={3}>{f.prerequisite || "─"}</td>
          </tr>
          {f.seriesType === "series" && (
            <>
              <tr>
                <td style={th}>시리즈</td>
                <td style={td} colSpan={3}>
                  {f.seriesTitle || "(시리즈 제목)"}&nbsp;&nbsp;
                  <span style={{ fontWeight: 700 }}>{f.seriesTotal}회기 중 {f.seriesCurrent}번째</span>
                </td>
              </tr>
              {f.prevTitles.filter(t=>t.trim()).length > 0 && (
                <tr>
                  <td style={th}>선행 차시</td>
                  <td style={td} colSpan={3}>
                    {f.prevTitles.filter(t=>t.trim()).map((t, idx) => {
                      const n = parseInt(f.seriesCurrent) - f.prevTitles.filter(t=>t.trim()).length + idx;
                      return <span key={idx}>{idx>0?" → ":""}{n}회차: {t}</span>;
                    })}
                  </td>
                </tr>
              )}
              {f.nextTitles.filter(t=>t.trim()).length > 0 && (
                <tr>
                  <td style={th}>후행 차시</td>
                  <td style={td} colSpan={3}>
                    {f.nextTitles.filter(t=>t.trim()).map((t, idx) => {
                      const n = parseInt(f.seriesCurrent) + 1 + idx;
                      return <span key={idx}>{idx>0?" → ":""}{n}회차: {t}</span>;
                    })}
                  </td>
                </tr>
              )}
            </>
          )}
          <tr>
            <td style={th}>수강료</td>
            <td style={{ ...td, fontWeight: 700, color: "#c00" }} colSpan={3}>
              무료 — 뭉클 사회봉사 교사 연수 프로그램
            </td>
          </tr>
        </tbody>
      </table>

      {/* 강의 목표 */}
      <div style={{ marginBottom: 14 }}>
        <div style={secH}>강 의 목 표</div>
        <div style={secBody}>
          {validObjs.length > 0
            ? validObjs.map((o, i) => (
                <div key={i} style={{ marginBottom: i < validObjs.length - 1 ? 3 : 0 }}>
                  <span style={{ fontWeight: 700, marginRight: 5 }}>{i + 1}.</span>{o}
                </div>
              ))
            : <span style={{ color: "#aaa" }}>─</span>}
        </div>
      </div>

      {/* 강의 내용 */}
      <div style={{ marginBottom: 14 }}>
        <div style={secH}>강 의 내 용 &nbsp;(총 {totalMin}분 / {parseInt(f.duration)}분)</div>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ background: "#222", color: "#fff" }}>
              <th style={{ ...thT, width: "11%" }}>단계</th>
              <th style={{ ...thT, width: "51%" }}>강의 내용</th>
              <th style={{ ...thT, width: "22%" }}>수업 방법</th>
              <th style={{ ...thT, width: "16%" }}>시간(분)</th>
            </tr>
          </thead>
          <tbody>
            {f.sessions.map((s, i) => (
              <tr key={i} style={{ background: i % 2 === 0 ? "#fff" : "#fafafa" }}>
                <td style={{ ...tdT, textAlign: "center", fontWeight: 700 }}>{s.step || "─"}</td>
                <td style={tdT}>{s.content || "─"}</td>
                <td style={{ ...tdT, textAlign: "center" }}>{s.methods && s.methods.length > 0 ? s.methods.join(" · ") : "─"}</td>
                <td style={{ ...tdT, textAlign: "center" }}>{s.time ? `${s.time}분` : "─"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* 산출물 */}
      <div style={{ marginBottom: 14 }}>
        <div style={secH}>강 의 산 출 물</div>
        <div style={secBody}>{f.output || "─"}</div>
      </div>

      {/* 준비물 & 참고사항 */}
      {(f.materials || f.notes || f.preApps.filter(a=>a.trim()).length > 0) && (
        <div style={{ marginBottom: 14 }}>
          <div style={secH}>준비물 및 참고 사항</div>
          <div style={secBody}>
            {f.preApps.filter(a=>a.trim()).length > 0 && (
              <div style={{ marginBottom: (f.materials || f.notes) ? 5 : 0 }}>
                <span style={{ fontWeight: 700 }}>사전 설치·가입 앱 : </span>
                {f.preApps.filter(a=>a.trim()).map((a,i) => <span key={i}>{i>0?" / ":""}{a}</span>)}
              </div>
            )}
            {f.materials && <div style={{ marginBottom: f.notes ? 5 : 0 }}><span style={{ fontWeight: 700 }}>준비물 : </span>{f.materials}</div>}
            {f.notes && <div><span style={{ fontWeight: 700 }}>참고 사항 : </span>{f.notes}</div>}
          </div>
        </div>
      )}

      {/* 푸터 */}
      <div style={{ borderTop: "0.5px solid #ddd", paddingTop: 7, display: "flex", justifyContent: "space-between", color: "#999", fontSize: 9 }}>
        <div>교사 디지털 연구회 뭉클 (Since 2019) | 감동있는 교육콘텐츠를 만들어갑니다</div>
      </div>
    </div>
  );

  // ── RENDER ──────────────────────────────────────────────────
  return (
    <div style={{ ...base, minHeight: "100vh", background: "var(--color-background-tertiary)" }}>
      {/* 숨겨진 인쇄 영역 */}
      <div id="mk-pa" style={{ background: "#fff" }}><PrintArea/></div>

      {/* 내비게이션 */}
      <div style={{ background: "#111", padding: "10px 20px", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <img src={LOGO_SRC} alt="뭉클" style={{ width: 32, height: 32, objectFit: "contain", filter: "invert(1)" }}/>
        <div>
          <div style={{ color: "#fff", fontWeight: 700, fontSize: 14 }}>뭉클 강의계획서</div>
          <div style={{ color: "rgba(255,255,255,0.45)", fontSize: 9.5 }}>뭉클한 밤·교원 디지털 야학</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
          {navBtn("✏ 작성하기", "form")}
          {navBtn("👁 미리보기", "preview")}
          {tab === "preview" && (
            <button onClick={() => {
              document.getElementById("mk-pa").style.display = "block";
              window.print();
              setTimeout(() => { document.getElementById("mk-pa").style.display = "none"; }, 500);
            }} style={{ padding: "7px 16px", borderRadius: 6, border: "none", background: "#fff", color: "#111", cursor: "pointer", fontSize: 13, fontWeight: 700, fontFamily: "inherit" }}>
              🖨 PDF 저장
            </button>
          )}
        </div>
      </div>

      {/* ── 작성 탭 ── */}
      {tab === "form" && (
        <div style={{ maxWidth: 660, margin: "0 auto", padding: "24px 16px 48px" }}>
          <FormSec title="📋 기본 정보">
            <Field label="수강 대상">
              <input value={f.target} onChange={e => set("target", e.target.value)} placeholder="초등 · 중등 교사" style={inp}/>
            </Field>
            <Field label="강사 소개 (간단히, 2~3줄)">
              <textarea value={f.bio} onChange={e => set("bio", e.target.value)} placeholder="경력, 관심 분야 등" style={{ ...inp, height: 54, resize: "vertical" }}/>
            </Field>
          </FormSec>

          <FormSec title="📅 강의 구성">
            <Row2>
              <Field label="강의 시간">
                <select value={f.duration} onChange={e => set("duration", e.target.value)} style={inp}>
                  {DURATION_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </Field>
              <Field label="강의 유형">
                <div style={{ display: "flex", gap: 8, paddingTop: 2 }}>
                  {["single","series"].map(t => (
                    <button key={t} onClick={() => set("seriesType", t)} style={{ flex: 1, padding: "7px 0", borderRadius: 6, border: `0.5px solid ${f.seriesType===t?"#111":"var(--color-border-secondary)"}`, background: f.seriesType===t?"#111":"transparent", color: f.seriesType===t?"#fff":"var(--color-text-primary)", cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: f.seriesType===t?700:400 }}>
                      {t==="single"?"단독 강의":"시리즈"}
                    </button>
                  ))}
                </div>
              </Field>
            </Row2>
            {f.seriesType === "series" && (
              <>
                <Field label="시리즈 제목">
                  <input value={f.seriesTitle} onChange={e => set("seriesTitle", e.target.value)} placeholder="예: AI로 우리 아이 그림책 출간하기" style={inp}/>
                </Field>
                <Row2>
                  <Field label="총 회기 수">
                    <input type="number" min="2" max="10" value={f.seriesTotal} onChange={e => set("seriesTotal", e.target.value)} style={inp}/>
                  </Field>
                  <Field label="현재 회차">
                    <input type="number" min="1" max={f.seriesTotal} value={f.seriesCurrent} onChange={e => set("seriesCurrent", e.target.value)} style={inp}/>
                  </Field>
                </Row2>
                <Field label="선행 차시 제목 (이전 회차들)">
                  {f.prevTitles.map((t, i) => (
                    <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                      <span style={{ fontSize: 11, color: "var(--color-text-secondary)", alignSelf: "center", whiteSpace: "nowrap", minWidth: 36 }}>{parseInt(f.seriesCurrent)-f.prevTitles.length+i}회차</span>
                      <input value={t} onChange={e => setPrev(i, e.target.value)} placeholder="이전 차시 강의 제목" style={{ ...inp, flex: 1 }}/>
                      {f.prevTitles.length > 1 && <button onClick={() => delPrev(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 18 }}>×</button>}
                    </div>
                  ))}
                  <button onClick={addPrev} style={{ fontSize: 12, color: "var(--color-text-secondary)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>+ 선행 차시 추가</button>
                </Field>
                <Field label="후행 차시 제목 (이후 회차들)">
                  {f.nextTitles.map((t, i) => (
                    <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                      <span style={{ fontSize: 11, color: "var(--color-text-secondary)", alignSelf: "center", whiteSpace: "nowrap", minWidth: 36 }}>{parseInt(f.seriesCurrent)+1+i}회차</span>
                      <input value={t} onChange={e => setNext(i, e.target.value)} placeholder="이후 차시 강의 제목" style={{ ...inp, flex: 1 }}/>
                      {f.nextTitles.length > 1 && <button onClick={() => delNext(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 18 }}>×</button>}
                    </div>
                  ))}
                  <button onClick={addNext} style={{ fontSize: 12, color: "var(--color-text-secondary)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>+ 후행 차시 추가</button>
                </Field>
              </>
            )}
          </FormSec>

          <FormSec title="📊 수준 및 산출물">
            <Field label="수강 수준">
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", paddingTop: 2 }}>
                {LEVEL_LIST.map(lv => (
                  <button key={lv} onClick={() => set("level", lv)} style={{ padding: "5px 18px", borderRadius: 20, border: `0.5px solid ${f.level===lv?"#111":"var(--color-border-secondary)"}`, background: f.level===lv?"#111":"transparent", color: f.level===lv?"#fff":"var(--color-text-primary)", cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: f.level===lv?700:400 }}>
                    {lv}
                  </button>
                ))}
              </div>
            </Field>
            <Field label="출발점 수준 (수강생에게 기대하는 사전 경험·지식)">
              <textarea value={f.prerequisite} onChange={e => set("prerequisite", e.target.value)} placeholder={LEVEL_DESC[f.level]} style={{ ...inp, height: 54, resize: "vertical" }}/>

            </Field>
            <Field label="강의 산출물 (이 강의를 마치면 무엇을 갖게 되나요?)">
              <input value={f.output} onChange={e => set("output", e.target.value)} placeholder="예: 캔바로 만든 나만의 수업 자료 템플릿 1종" style={inp}/>
            </Field>
          </FormSec>

          <FormSec title="🎯 강의 목표">
            <p style={{ fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 10, marginTop: -4 }}>
              선생님이 이 강의를 통해 얻게 될 것을 구체적으로 적어주세요.
            </p>
            {f.objectives.map((o, i) => (
              <Field key={i} label={`목표 ${i + 1}`}>
                <input value={o} onChange={e => setObj(i, e.target.value)}
                  placeholder={["이 도구를 수업에서 바로 활용할 수 있다", "제한 시간 안에 간단한 앱을 만들 수 있다", "동료 교사에게 이 강의를 자신 있게 추천할 수 있다"][i]}
                  style={inp}/>
              </Field>
            ))}
          </FormSec>

          <FormSec title={`📚 강의 내용 (${parseInt(f.duration)/60}시간 흐름)`}>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 10, marginTop: -4 }}>
              합계:&nbsp;
              <strong style={{ color: totalMin > parseInt(f.duration) ? "#c00" : "inherit" }}>{totalMin}분</strong>
              &nbsp;/&nbsp;목표: <strong>{f.duration}분</strong>
              {totalMin > parseInt(f.duration) && <span style={{ color: "#c00" }}> ▲ 초과!</span>}
              {totalMin === parseInt(f.duration) && <span style={{ color: "#080" }}> ✓ 딱 맞습니다</span>}
            </p>
            {f.sessions.map((s, i) => (
              <div key={i} style={{ border: "0.5px solid var(--color-border-tertiary)", borderRadius: 8, padding: "10px 12px", marginBottom: 8, background: "var(--color-background-primary)" }}>
                <div style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
                  <input value={s.step} onChange={e => setSes(i, "step", e.target.value)} placeholder="단계" style={{ ...inp, width: 76, flex: "0 0 76px", textAlign: "center" }}/>
                  <input value={s.time} onChange={e => setSes(i, "time", e.target.value)} placeholder="분" style={{ ...inp, width: 56, flex: "0 0 56px", textAlign: "center" }}/>
                  {f.sessions.length > 1 && (
                    <button onClick={() => delSes(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 20, lineHeight: 1, padding: "0 2px", marginLeft: "auto" }}>×</button>
                  )}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 10px", marginBottom: 8 }}>
                  {METHOD_LIST.map(m => {
                    const checked = s.methods.includes(m);
                    return (
                      <label key={m} style={{ display: "flex", alignItems: "center", gap: 4, cursor: "pointer", fontSize: 12, padding: "3px 8px", borderRadius: 20, border: `0.5px solid ${checked ? "#111" : "var(--color-border-secondary)"}`, background: checked ? "#111" : "transparent", color: checked ? "#fff" : "var(--color-text-primary)", userSelect: "none", transition: "all 0.1s" }}>
                        <input type="checkbox" checked={checked} onChange={() => toggleMethod(i, m)} style={{ display: "none" }}/>
                        {m}
                      </label>
                    );
                  })}
                </div>
                <textarea value={s.content} onChange={e => setSes(i, "content", e.target.value)} placeholder="이 단계에서 진행할 내용을 설명하세요" style={{ ...inp, height: 50, resize: "vertical", display: "block" }}/>
              </div>
            ))}
            <button onClick={addSes} style={{ width: "100%", padding: "8px", border: "1px dashed var(--color-border-secondary)", borderRadius: 8, background: "transparent", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 13, fontFamily: "inherit" }}>
              + 단계 추가
            </button>
          </FormSec>

          <FormSec title="📌 준비물 및 참고 사항">
            <Field label="사전 설치·가입 앱/서비스 (강의 전 미리 준비해야 할 것)">
              {f.preApps.map((a, i) => (
                <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                  <input value={a} onChange={e => setApp(i, e.target.value)} placeholder="예: 구글 계정 가입, Canva 앱 설치" style={{ ...inp, flex: 1 }}/>
                  {f.preApps.length > 1 && <button onClick={() => delApp(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 18 }}>×</button>}
                </div>
              ))}
              <button onClick={addApp} style={{ fontSize: 12, color: "var(--color-text-secondary)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>+ 항목 추가</button>
            </Field>
            <Field label="준비물">
              <input value={f.materials} onChange={e => set("materials", e.target.value)} placeholder="예: 개인 노트북, 구글 계정" style={inp}/>
            </Field>
            <Field label="참고 사항 (수강 안내, 신청 방법 등)">
              <textarea value={f.notes} onChange={e => set("notes", e.target.value)} placeholder="기타 공지, 유의 사항 등" style={{ ...inp, height: 62, resize: "vertical" }}/>
            </Field>
          </FormSec>

          <FormSec title="🏷 키워드 태그">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: f.tags.length > 0 ? 8 : 0 }}>
              {f.tags.map(t => (
                <span key={t} style={{ display: "flex", alignItems: "center", gap: 3, padding: "3px 10px", borderRadius: 20, background: "#111", color: "#fff", fontSize: 12 }}>
                  #{t}
                  <button onClick={() => delTag(t)} style={{ background: "none", border: "none", cursor: "pointer", color: "rgba(255,255,255,0.6)", fontSize: 15, lineHeight: 1, padding: 0 }}>×</button>
                </span>
              ))}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <input
                value={tagInput}
                onChange={e => setTagInput(e.target.value)}
                onKeyDown={e => { if(e.key==="Enter"||e.key===","){e.preventDefault();addTag(tagInput);setTagInput("");}}}
                placeholder="태그 입력 후 Enter — 예: Canva, AI이미지, 수업자료"
                style={{ ...inp, flex: 1 }}
              />
              <button onClick={() => {addTag(tagInput);setTagInput("");}} style={{ padding: "7px 14px", borderRadius: 6, border: "0.5px solid var(--color-border-secondary)", background: "transparent", cursor: "pointer", fontSize: 13, fontFamily: "inherit", color: "var(--color-text-primary)" }}>추가</button>
            </div>
            <p style={{ margin: "4px 0 0", fontSize: 11, color: "var(--color-text-secondary)" }}># 는 자동으로 붙습니다. 쉼표 또는 Enter로 구분하여 입력하세요.</p>
          </FormSec>

          <div style={{ textAlign: "center" }}>
            <button onClick={() => setTab("preview")} style={{ background: "#111", color: "#fff", border: "none", padding: "13px 36px", borderRadius: 8, cursor: "pointer", fontSize: 15, fontWeight: 700, fontFamily: "inherit" }}>
              미리보기 · PDF 저장 →
            </button>
          </div>
        </div>
      )}

      {/* ── 미리보기 탭 ── */}
      {tab === "preview" && (
        <div style={{ padding: "20px 16px 48px", display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setTab("form")} style={{ padding: "8px 18px", borderRadius: 6, border: "0.5px solid var(--color-border-secondary)", background: "var(--color-background-primary)", cursor: "pointer", fontSize: 13, fontFamily: "inherit", color: "var(--color-text-primary)" }}>← 수정하기</button>
            <button onClick={() => {
              document.getElementById("mk-pa").style.display = "block";
              window.print();
              setTimeout(() => { document.getElementById("mk-pa").style.display = "none"; }, 600);
            }} style={{ padding: "8px 22px", borderRadius: 6, border: "none", background: "#111", color: "#fff", cursor: "pointer", fontSize: 13, fontWeight: 700, fontFamily: "inherit" }}>
              🖨 PDF로 저장하기
            </button>
          </div>
          <div style={{ boxShadow: "0 6px 30px rgba(0,0,0,0.13)", borderRadius: 4, overflow: "hidden" }}>
            <PrintArea/>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

  </script>
</body>
</html>
