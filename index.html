<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>뭉클한 밤 · 강의계획서</title>
  <!-- React와 앱 코드는 저장소에 포함된 로컬 파일을 사용합니다 (외부 CDN 의존성 없음).
       앱 원본은 src/app.jsx 이며, 수정 후 npm run build 로 app.js를 재생성합니다. -->

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 0; }
    input, textarea, select, button {
      font-family: "Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",sans-serif;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.15);
    }
    /* CSS 변수 (GitHub Pages 환경용 fallback) */
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f5;
      --color-background-tertiary: #efefef;
      --color-text-primary: #111111;
      --color-text-secondary: #666666;
      --color-border-secondary: #cccccc;
      --color-border-tertiary: #e0e0e0;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    #mk-pa { display: none; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;font-family:'Apple SD Gothic Neo','맑은 고딕','Malgun Gothic',sans-serif;color:#444;">
      <div style="width:34px;height:34px;border:3px solid #e0e0e0;border-top-color:#111;border-radius:50%;animation:bootspin 0.8s linear infinite;"></div>
      <div style="font-size:14px;">강의계획서 도구를 불러오는 중입니다…</div>
    </div>
  </div>

  <!-- 저장소에 포함된 로컬 스크립트 (외부 네트워크 불필요) -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./app.js"></script>

  <!-- 안전장치: 스크립트 로드 실패 시 흰 화면 대신 안내 표시 -->
  <script>
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (b && !window.React) {
        b.innerHTML =
          '<div style="max-width:430px;text-align:center;padding:24px;">' +
            '<div style="font-size:34px;margin-bottom:12px;">⚠️</div>' +
            '<div style="font-size:15px;font-weight:700;margin-bottom:10px;">페이지를 불러오지 못했습니다</div>' +
            '<div style="font-size:13px;color:#666;line-height:1.7;">필요한 파일을 불러오지 못했습니다.<br/>새로고침해도 같은 증상이면 브라우저 캐시를 지운 뒤 다시 시도해 주세요.</div>' +
            '<button onclick="location.reload()" style="margin-top:18px;padding:8px 22px;border:none;border-radius:6px;background:#111;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">다시 시도</button>' +
          '</div>';
      }
    }, 8000);
  </script>
</body>
</html>
